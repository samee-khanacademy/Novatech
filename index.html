<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NovaTech Project Management System – Prototype</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#dce2ee;--ink:#1c2538;--mute:#5d6882;--pri:#2457a6;--pri-d:#1b437f;--ok:#1b8a5a;--bad:#c0392b;--warn:#b7791f;--soft:#e9eff9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
.demo{background:#fff6dc;color:#6b5200;font-size:12.5px;padding:5px 14px;text-align:center;border-bottom:1px solid #ecd990}
header{background:#14284b;color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px}.brand span{font-weight:400;opacity:.75;margin-left:6px;font-size:13px}
.roles{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;margin-left:auto}
.roles button{border:0;background:none;color:#cfd9ee;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;position:relative}
.roles button[aria-pressed=true]{background:#fff;color:#14284b;font-weight:600}
.roles .dot{position:absolute;top:3px;right:5px;width:8px;height:8px;border-radius:50%;background:#ff9f43}
.reset{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.map{font-size:12.5px;display:flex;align-items:center;gap:6px;color:#cfd9ee}
/* tracker */
.tracker{display:flex;gap:0;max-width:1100px;margin:18px auto 6px;padding:0 16px;overflow-x:auto}
.st{flex:1;min-width:104px;text-align:center;position:relative;padding-top:2px}
.st::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.st:first-child::before{display:none}
.st.done::before,.st.now::before{background:var(--ok)}
.st .c{width:30px;height:30px;border-radius:50%;margin:0 auto 4px;background:#fff;border:3px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);position:relative;z-index:1}
.st.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.st.now .c{border-color:var(--pri);color:var(--pri);box-shadow:0 0 0 4px #2457a633}
.st.bad .c{background:var(--bad);border-color:var(--bad);color:#fff}
.st b{display:block;font-size:12.5px}.st small{color:var(--mute);font-size:11px}
body.nomap .a{display:none}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 50px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 2px}h3{font-size:14px;margin:0 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--mute);font-size:13.5px;margin:0 0 14px}
.a{display:inline-block;background:var(--soft);color:var(--pri-d);font-size:11px;font-weight:700;padding:1px 7px;border-radius:9px;margin-right:4px;vertical-align:1px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #c5cee0;border-radius:8px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.r2{grid-template-columns:1fr}}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;margin-top:16px}
.btn:hover{background:var(--pri-d)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:18px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #e8ecf4;vertical-align:middle}
th{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600}
.p-ok{background:#dff4e8;color:#14633a}.p-w{background:#fdf0d5;color:#8a5a0a}.p-b{background:#fbe3df;color:#8f2a20}.p-i{background:var(--soft);color:var(--pri-d)}
.note{border-radius:10px;padding:11px 13px;font-size:14px;margin-bottom:12px}
.n-i{background:var(--soft)}.n-ok{background:#e3f6ec;color:#14633a}.n-b{background:#fbe6e3;color:#8f2a20}.n-w{background:#fdf3dc;color:#7a5200}
.big{font:700 22px ui-monospace,Menlo,Consolas,monospace;color:var(--ok)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:7px;background:#e6ebf4;border-radius:4px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--pri)}
.skill{display:inline-block;font-size:11.5px;background:#eef1f7;border-radius:6px;padding:1px 6px;margin:0 3px 2px 0}
.tl{list-style:none;margin:6px 0 0;padding:0}.tl li{padding:6px 0 6px 18px;position:relative;font-size:14px;border-left:2px solid var(--line);margin-left:6px}
.tl li::before{content:"";position:absolute;left:-6px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.log{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;font-size:13px}
.log li{padding:5px 0;border-bottom:1px solid #eef1f7;color:#33405a}.log time{color:var(--mute);font-size:11.5px;margin-right:6px}
.empty{color:var(--mute);padding:6px 0}
</style>
</head>
<body>
<div class="demo">Throw-away prototype for demonstration. Data lives only in this browser tab and nothing is saved. Tags such as <b>A5</b> point to steps in the Activity Diagram.</div>
<header>
  <div class="brand">NovaTech<span>Project Management System</span></div>
  <label class="map"><input type="checkbox" id="mapchk" checked style="width:auto"> Show diagram steps</label>
  <div class="roles" id="roles" role="group" aria-label="Demo as"></div>
  <button class="reset" id="reset">Restart demo</button>
</header>
<div class="tracker" id="tracker" aria-label="Process progress"></div>
<div class="wrap">
  <main id="main"></main>
  <aside>
    <div class="card" id="next"></div>
    <div class="card"><h3>Activity log</h3><ul class="log" id="log" aria-live="polite"></ul></div>
  </aside>
</div>

<script>
"use strict";
const STAFF=[
 {id:0,n:"Aisha Rahman",role:"Software Engineer",skills:["Java","Cloud","API"],av:80},
 {id:1,n:"Daniel Lim",role:"Software Engineer",skills:["Web","API","JavaScript"],av:55},
 {id:2,n:"Farah Ismail",role:"Software Engineer",skills:["Mobile","Android","iOS"],av:70},
 {id:3,n:"Priya Nair",role:"UI/UX Designer",skills:["Design","Prototyping","Web","Mobile"],av:65},
 {id:4,n:"Wei Jie Tan",role:"Software Tester",skills:["QA","Automation"],av:90},
 {id:5,n:"Kumar Raj",role:"Business Analyst",skills:["Requirements","Cloud"],av:40}
];
const WANT={"Web application":["Web","API","Design"],"Mobile application":["Mobile","Design"],"Cloud solution":["Cloud","API"],"System integration":["API","Cloud"],"Software maintenance":["QA","Java"]};
const STEPS=[["Register","A1–A2"],["Request","A3–A4"],["Proposal","A5–A6"],["Decision","A7–A8"],["Payment","A9–A10"],["Confirm","A11"],["Staffing","A12–A14"]];
const ROLES=["Client","Project Manager","Finance Officer"];
const FRESH=()=>({stage:"none",role:"Client",acct:null,req:null,prop:null,deadline:null,pay:null,payFailed:false,ref:null,team:[],sched:null,log:[],cancelReason:""});
let S=FRESH(),timer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rm=n=>"RM "+Number(n).toLocaleString("en-MY");
const A=t=>`<span class="a">${t}</span>`;
const log=m=>{const d=new Date();S.log.unshift(`<time>${d.toTimeString().slice(0,8)}</time>${esc(m)}`)};

/* ---------- which role needs to act, and what ---------- */
function waiting(){
  switch(S.stage){
    case"none":return{who:"Client",what:"Register an account",a:"A1"};
    case"registered":return{who:"Client",what:"Submit a project request",a:"A3"};
    case"requested":return{who:"Project Manager",what:"Review the request and prepare a proposal",a:"A5"};
    case"proposed":return{who:"Client",what:"Approve or reject the proposal before the deadline",a:"A7"};
    case"approved":return{who:"Client",what:"Make the initial payment",a:"A9"};
    case"paid":return{who:"Finance Officer",what:"Verify the payment",a:"A10"};
    case"confirmed":return{who:"Project Manager",what:"Create the schedule and assign the team",a:"A12"};
    default:return null;
  }
}
function stepIndex(){return{none:0,registered:1,requested:2,proposed:3,approved:4,paid:4,confirmed:5,staffed:7,cancelled:3}[S.stage]}

/* ---------- views ---------- */
function clientView(){
  const r=S.req,p=S.prop;
  switch(S.stage){
  case"none":return`<div class="card"><h2>Create your client account</h2><p class="sub">${A("A1")}Tell us about your company. The system checks the details and opens your account ${A("A2")}</p>
   <div class="r2"><div><label for="co">Company name</label><input id="co" value="Bright Retail Sdn Bhd"></div><div><label for="cp">Contact person</label><input id="cp" value="Sarah Wong"></div></div>
   <div class="r2"><div><label for="em">Email</label><input id="em" type="email" value="sarah@brightretail.example"></div><div><label for="pw">Password (8+ characters)</label><input id="pw" type="password" value="password1"></div></div>
   <div class="err" id="err"></div><button class="btn" data-do="register">Create account</button></div>`;
  case"registered":return`<div class="card"><h2>New project request</h2><p class="sub">${A("A3")}Describe what you need. The project manager is notified as soon as you submit ${A("A4")}</p>
   <label for="sol">Solution required</label><select id="sol">${Object.keys(WANT).map(o=>`<option>${o}</option>`).join("")}</select>
   <label for="obj">Objectives</label><textarea id="obj" rows="2">Let customers order online and cut manual order handling</textarea>
   <div class="r2"><div><label for="dt">Expected completion</label><input id="dt" type="date" value="2027-06-30"></div><div><label for="bud">Estimated budget (RM)</label><input id="bud" type="number" min="1" value="45000"></div></div>
   <label for="ft">Required features</label><textarea id="ft" rows="2">Customer login, product catalogue, payment gateway, admin dashboard</textarea>
   <div class="err" id="err"></div><button class="btn" data-do="request">Submit request</button></div>`;
  case"requested":return`<div class="card"><h2>Request received</h2><p class="sub">${esc(r.sol)} · budget ${rm(r.bud)} · due ${esc(r.dt)}</p><div class="note n-i">Your project manager is preparing a proposal. You will see it here with the time you have to respond.</div></div>`;
  case"proposed":return`<div class="card"><h2>Your proposal</h2><p class="sub">${A("A7")}Review it and decide. If the deadline passes with no answer the request is cancelled ${A("A8")}</p>
   <div class="note n-w">Time left to respond: <span class="timer" id="tl"></span></div>
   <table><tr><th>Estimated cost</th><td><b>${rm(p.cost)}</b></td></tr><tr><th>Duration</th><td>${p.weeks} weeks</td></tr><tr><th>Deliverables</th><td>${esc(p.del)}</td></tr><tr><th>Terms</th><td>${esc(p.tc)}</td></tr></table>
   <div class="row"><button class="btn ok" data-do="approve">Approve proposal</button><button class="btn bad" data-do="reject">Reject</button><button class="btn ghost" data-do="ff" title="Demo only: shortens the deadline to 3 seconds">Skip ahead: let deadline lapse</button></div></div>`;
  case"approved":return`<div class="card"><h2>Pay the initial amount</h2><p class="sub">${A("A9")}Paying confirms your project.</p>
   ${S.payFailed?`<div class="note n-b">We could not verify your last payment. Please try again.</div>`:""}
   <table><tr><th>Amount due now (30% of ${rm(p.cost)})</th><td><b>${rm(Math.round(p.cost*0.3))}</b></td></tr></table>
   <label for="pm">Method</label><select id="pm"><option>Online banking</option><option>Credit / debit card</option><option>Bank transfer</option></select>
   <button class="btn" data-do="pay">Pay now</button></div>`;
  case"paid":return`<div class="card"><h2>Payment submitted</h2><div class="note n-i">Finance is checking your payment. Your project reference number appears once it is confirmed.</div></div>`;
  case"confirmed":return`<div class="card"><h2>Project confirmed</h2><p class="sub">${A("A11")}Reference number</p><div class="big">${S.ref}</div><div class="note n-i" style="margin-top:12px">Your project manager is building the schedule and choosing the team.</div></div>`;
  case"staffed":return dashboard();
  case"cancelled":return`<div class="card"><h2>Request cancelled</h2><div class="note n-b">${esc(S.cancelReason)} A cancellation notice has been sent ${A("A8")}</div><button class="btn" data-do="again">Start a new request</button></div>`;
  }
}
function pmView(){
  const r=S.req;
  switch(S.stage){
  case"none":case"registered":return`<div class="card"><h2>Project requests</h2><p class="empty">No requests yet. A client has to register and submit one first.</p></div>`;
  case"requested":{const sug=Math.round(r.bud*0.92/500)*500;return`<div class="card"><h2>New request waiting</h2><p class="sub">${A("A5")}Check the request, then build the proposal. It goes to the client when you publish ${A("A6")}</p>
   <table><tr><th>Client</th><td>${esc(S.acct.co)}</td><th>Solution</th><td>${esc(r.sol)}</td></tr><tr><th>Budget</th><td>${rm(r.bud)}</td><th>Due</th><td>${esc(r.dt)}</td></tr><tr><th>Objectives</th><td colspan="3">${esc(r.obj)}</td></tr><tr><th>Features</th><td colspan="3">${esc(r.ft)}</td></tr></table>
   <h3 style="margin-top:18px">Proposal</h3>
   <div class="r2"><div><label for="cost">Estimated cost (RM)</label><input id="cost" type="number" min="1" value="${sug}"></div><div><label for="wk">Duration (weeks)</label><input id="wk" type="number" min="1" value="20"></div></div>
   <label for="del">Deliverables</label><textarea id="del" rows="2">Design mock-ups, working portal, test report, user training</textarea>
   <label for="tc">Terms and conditions</label><textarea id="tc" rows="2">30% payable upfront. Changes are costed separately and need your approval first.</textarea>
   <label for="per">Time the client has to respond (seconds, short for the demo)</label><input id="per" type="number" min="5" value="90">
   <div class="err" id="err"></div><button class="btn" data-do="publish">Publish proposal</button></div>`}
  case"proposed":return`<div class="card"><h2>Proposal sent</h2><div class="note n-w">Waiting for the client. Time left: <span class="timer" id="tl"></span></div></div>`;
  case"approved":case"paid":return`<div class="card"><h2>Proposal approved</h2><div class="note n-i">Waiting for the initial payment to be verified. You can schedule the project once it is confirmed.</div></div>`;
  case"confirmed":{const want=WANT[r.sol]||[];return`<div class="card"><h2>Schedule and assign team</h2><p class="sub">${A("A12")}Pick people by skill and availability. Project <b>${S.ref}</b></p>
   <table><tr><th></th><th>Name</th><th>Role</th><th>Skills</th><th>Available</th></tr>
   ${STAFF.map(e=>{const fit=e.skills.filter(s=>want.includes(s));return`<tr><td><input type="checkbox" class="emp" value="${e.id}" aria-label="Assign ${esc(e.n)}" style="width:auto" ${e.av<50?"":""}></td><td>${esc(e.n)}</td><td>${e.role}</td>
   <td>${e.skills.map(s=>`<span class="skill" ${want.includes(s)?'style="background:#dff4e8;color:#14633a"':""}>${s}</span>`).join("")}${fit.length?'<span class="pill p-ok">fits</span>':""}</td>
   <td style="min-width:90px"><div class="bar"><i style="width:${e.av}%;${e.av<50?"background:var(--warn)":""}"></i></div><small>${e.av}%</small></td></tr>`}).join("")}</table>
   <div class="r2"><div><label for="st">Start date</label><input id="st" type="date" value="2027-01-11"></div><div><label for="ms">First milestone</label><input id="ms" value="Design sign-off"></div></div>
   <div class="err" id="err"></div><button class="btn" data-do="assign">Save schedule and notify team</button></div>`}
  case"staffed":return dashboard();
  case"cancelled":return`<div class="card"><h2>Request closed</h2><p class="empty">${esc(S.cancelReason)}</p></div>`;
  }
}
function finView(){
  if(S.stage==="paid")return`<div class="card"><h2>Payment to verify</h2><p class="sub">${A("A10")}Check the bank record, then confirm or flag it.</p>
   <table><tr><th>Client</th><td>${esc(S.acct.co)}</td></tr><tr><th>Amount</th><td><b>${rm(Math.round(S.prop.cost*0.3))}</b></td></tr><tr><th>Method</th><td>${esc(S.pay)}</td></tr></table>
   <div class="row"><button class="btn ok" data-do="verifyOK">Payment received</button><button class="btn bad" data-do="verifyNo">Not received</button></div></div>`;
  const done=["confirmed","staffed"].includes(S.stage);
  return`<div class="card"><h2>Payments</h2><p class="empty">${done?`Initial payment for <b>${S.ref}</b> was verified. Nothing else is waiting.`:"Nothing to verify right now."}</p></div>`;
}
function dashboard(){
  const s=S.sched,start=new Date(s.st),w=S.prop.weeks;
  const at=f=>{const d=new Date(start);d.setDate(d.getDate()+Math.round(w*7*f));return d.toISOString().slice(0,10)};
  return`<div class="card"><h2>Project ${S.ref} <span class="pill p-ok">Scheduled</span></h2><p class="sub">${A("A13")}${esc(S.acct.co)} · ${esc(S.req.sol)} · ${rm(S.prop.cost)}</p>
   <h3>Milestones</h3><ul class="tl"><li><b>${esc(s.ms)}</b> · ${s.st}</li><li><b>Build and review</b> · ${at(.35)}</li><li><b>User acceptance testing</b> · ${at(.8)}</li><li><b>Go-live</b> · ${at(1)}</li></ul>
   <h3 style="margin-top:16px">Team ${A("A14")}</h3><table>${S.team.map(i=>`<tr><td>${esc(STAFF[i].n)}</td><td>${STAFF[i].role}</td><td><span class="pill p-ok">Notified</span></td></tr>`).join("")}</table></div>`;
}

/* ---------- render ---------- */
function render(){
  $("#roles").innerHTML=ROLES.map(r=>`<button aria-pressed="${S.role===r}" data-role="${r}">${r}${waiting()&&waiting().who===r&&S.role!==r?'<i class="dot" title="Waiting on this role"></i>':""}</button>`).join("");
  const idx=stepIndex();
  $("#tracker").innerHTML=STEPS.map((s,i)=>{const cls=S.stage==="cancelled"&&i===3?"bad":i<idx?"done":i===idx&&S.stage!=="staffed"?"now":"";
    return`<div class="st ${cls}"><div class="c">${cls==="done"?"✓":cls==="bad"?"✕":i+1}</div><b>${s[0]}</b><small class="a" style="background:none;padding:0">${s[1]}</small></div>`}).join("");
  $("#main").innerHTML=S.role==="Client"?clientView():S.role==="Project Manager"?pmView():finView();
  const w=waiting();
  $("#next").innerHTML=`<h3>Next step</h3>`+(w?`<p style="margin:0 0 8px"><b>${w.who}:</b> ${w.what} ${A(w.a)}</p>${w.who!==S.role?`<button class="btn ghost" style="margin:0" data-role="${w.who}">Switch to ${w.who}</button>`:`<p class="sub" style="margin:0">That is you in this view.</p>`}`:`<p class="sub" style="margin:0">${S.stage==="cancelled"?"The process ended with a cancelled request.":"The project-start workflow is complete."}</p>`);
  $("#log").innerHTML=S.log.length?S.log.map(l=>`<li>${l}</li>`).join(""):`<li class="empty">Nothing yet</li>`;
  startTimer();
}
function startTimer(){
  clearInterval(timer);
  if(S.stage!=="proposed")return;
  const tick=()=>{
    const left=Math.ceil((S.deadline-Date.now())/1000),el=$("#tl");
    if(left<=0){clearInterval(timer);S.stage="cancelled";S.cancelReason="The approval period ran out with no reply, so the request was cancelled automatically.";log("Approval period expired; request cancelled");render();return}
    if(el)el.textContent=left+"s";
  };
  tick();timer=setInterval(tick,500);
}

/* ---------- actions ---------- */
const val=id=>($("#"+id)||{}).value??"";
const fail=m=>{const e=$("#err");if(e)e.textContent=m;return false};
const ACTIONS={
 register(){const co=val("co").trim(),em=val("em").trim();
  if(!co)return fail("Company name is required.");if(!/^\S+@\S+\.\S+$/.test(em))return fail("Enter a valid email address.");if(val("pw").length<8)return fail("Password needs at least 8 characters.");
  S.acct={co,cp:val("cp"),em};S.stage="registered";log("Account created for "+co)},
 request(){const bud=+val("bud");if(!val("obj").trim())return fail("Please describe the objectives.");if(!(bud>0))return fail("Enter a budget above zero.");
  S.req={sol:val("sol"),obj:val("obj"),dt:val("dt"),bud,ft:val("ft")};S.stage="requested";log("Project request submitted; project manager notified")},
 publish(){const cost=+val("cost"),wk=+val("wk"),per=Math.max(5,+val("per")||90);if(!(cost>0&&wk>0))return fail("Cost and duration must be above zero.");
  S.prop={cost,weeks:wk,del:val("del"),tc:val("tc")};S.deadline=Date.now()+per*1000;S.stage="proposed";log("Proposal published; "+per+"s approval timer started")},
 approve(){S.stage="approved";clearInterval(timer);log("Client approved the proposal")},
 reject(){S.stage="cancelled";S.cancelReason="You rejected the proposal.";log("Client rejected the proposal; request cancelled")},
 ff(){S.deadline=Date.now()+3000},
 pay(){S.pay=val("pm");S.payFailed=false;S.stage="paid";log("Initial payment submitted ("+S.pay+")")},
 verifyOK(){S.ref="NTS-2027-"+String(100+Math.floor(Math.random()*900));S.stage="confirmed";log("Payment verified; project "+S.ref+" confirmed")},
 verifyNo(){S.payFailed=true;S.stage="approved";S.role="Client";log("Payment not received; client asked to pay again")},
 assign(){const ids=[...document.querySelectorAll(".emp:checked")].map(e=>+e.value);
  if(!ids.length)return fail("Pick at least one person.");if(!ids.some(i=>STAFF[i].role==="Software Engineer"))return fail("Include at least one software engineer.");
  S.team=ids;S.sched={st:val("st"),ms:val("ms")};S.stage="staffed";log("Schedule saved; "+ids.length+" team members notified")},
 again(){const keep=S.acct;S=FRESH();S.acct=keep;S.stage="registered";S.role="Client";log("New request started")}
};
document.addEventListener("click",e=>{
  const r=e.target.closest("[data-role]");if(r){S.role=r.dataset.role;render();return}
  const a=e.target.closest("[data-do]");if(a){if(ACTIONS[a.dataset.do]()!==false)render()}
});
$("#reset").onclick=()=>{S=FRESH();render()};
$("#mapchk").onchange=e=>document.body.classList.toggle("nomap",!e.target.checked);
render();
</script>
</body>
